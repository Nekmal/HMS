# ==============================================================================
# University of Ruhuna - Hostel Management System (HMS) Configuration
# ==============================================================================

# Embedded Tomcat Web Server Port & Context Path Configuration
server.port=8094
server.servlet.context-path=/hms

# MySQL / MariaDB Database Connection Settings
# Connects to local MySQL instance on port 3306, automatically creates hms_db if absent
spring.datasource.url=jdbc:mysql://localhost:3306/hms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Spring Data JPA & Hibernate Engine Configuration
# ddl-auto=update automatically syncs entity structures while preserving custom triggers & procedures
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Transactional Email (SMTP) Configuration for Student Receipts & Alerts
# Replace with university/system Gmail App Password for live mail dispatch
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

