<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RUHUNA Hostel Management System</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Gradient background instead of solid color */
            background: linear-gradient(135deg, #f5f5f5 0%, #FFD700 100%);
        }
        .login-box {
            background-color: var(--white);
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 650px;
            border-top: 8px solid var(--dark-black);
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--dark-black);
            font-size: 32px;
        }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 18px; }
        .form-group input {
            width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;
        }
        .btn-primary { padding: 15px; font-size: 18px; border-radius: 8px; }
        .error-msg {
            color: red;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>RUHUNA Hostel Management System</h2>
        <div id="errorMsg" class="error-msg">Invalid Credentials!</div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Student ID / Username</label>
                <input type="text" id="username" required placeholder="e.g. admin or RU/2023/101">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Password">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Login</button>
        </form>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/hms/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ studentId: username, password: password })
                });

                if (res.ok) {
                    const user = await res.json();
                    // Save session data in local storage
                    localStorage.setItem('userId', user.id);
                    localStorage.setItem('userName', user.fullName);
                    localStorage.setItem('userRole', user.role);

                    // Redirect based on role
                    if (user.role === 'ADMIN') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'student-dashboard.html';
                    }
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            } catch (e) {
                console.error("Login failed", e);
            }
        }
    </script>
</body>
</html>
