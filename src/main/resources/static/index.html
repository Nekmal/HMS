<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RUHUNA Hostel Management System</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
    <div class="login-box">
        <div class="login-brand-header">
            <div class="brand-icon-circle">
                <i class="fas fa-hotel"></i>
            </div>
            <h2 class="brand-title">RUHUNA</h2>
            <p class="brand-subtitle">Hostel Management System</p>
            <div class="brand-divider"></div>
        </div>
        <div id="errorMsg" class="error-msg">Invalid Credentials!</div>
        <form id="loginForm" class="login-form" onsubmit="handleLogin(event)" autocomplete="off">
            <div class="form-group">
                <label>Student ID / Username <span class="required-star">*</span></label>
                <input type="text" id="username" name="hms_user_identifier" autocomplete="off" readonly onfocus="this.removeAttribute('readonly');" required placeholder="Enter Student ID / Username">
            </div>
            <div class="form-group">
                <label>Password <span class="required-star">*</span></label>
                <input type="password" id="password" name="hms_user_secret" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');" required placeholder="Enter Password">
            </div>
            <button type="submit" class="btn btn-primary btn-login-submit">Login</button>
        </form>

    </div>

    <script>
        // Force-clear inputs on page load to prevent browser password managers from auto-filling
        window.addEventListener('DOMContentLoaded', () => {
            const clearInputs = () => {
                const u = document.getElementById('username');
                const p = document.getElementById('password');
                if (u) u.value = '';
                if (p) p.value = '';
            };
            clearInputs();
            setTimeout(clearInputs, 50);
            setTimeout(clearInputs, 200);
        });

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/hms/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ studentId: username, password: password })
                });

                if (res.ok) {
                    const user = await res.json();
                    // Save session data in local storage for all portals
                    localStorage.setItem('userId', user.id);
                    localStorage.setItem('userName', user.fullName);
                    localStorage.setItem('userRole', user.role);
                    localStorage.setItem('hms_user', JSON.stringify({
                        id: user.id,
                        username: user.studentId,
                        fullName: user.fullName,
                        role: user.role
                    }));

                    // Role-based redirect
                    const role = (user.role || '').toUpperCase();
                    if (role === 'ADMIN') {
                        window.location.href = 'admin/dashboard.html';
                    } else if (role === 'SECURITY') {
                        window.location.href = 'security/dashboard.html';
                    } else if (role === 'MAINTENANCE') {
                        window.location.href = 'maintenance/dashboard.html';
                    } else if (role === 'CLEANING') {
                        window.location.href = 'cleaning/dashboard.html';
                    } else {
                        window.location.href = 'student/dashboard.html';
                    }
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            } catch (e) {
                console.error("Login failed", e);
                document.getElementById('errorMsg').textContent = 'Network or server error during login.';
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
