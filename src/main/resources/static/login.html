<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RUHUNA Hostel Management System</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css?v=2.0">
</head>
<body class="login-page">
    <div class="login-box">
        <div class="login-brand-header">
            <div class="brand-icon-circle">
                <i class="fas fa-hotel"></i>
            </div>
            <h2 class="brand-title">RUHUNA</h2>
            <p class="brand-subtitle">Hostel Management System</p>
            <div class="brand-divider"></div>
        </div>
        <div id="errorMsg" class="error-msg">Invalid Credentials!</div>
        <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Student ID / Staff Username <span class="required-star">*</span></label>
                <input type="text" id="username" required placeholder="e.g. admin, SEC001, MNT001, CLN001, TG/2021/0001" oninput="detectThemeFromInput(this.value)">
            </div>
            <div class="form-group">
                <label>Password <span class="required-star">*</span></label>
                <input type="password" id="password" required placeholder="Password">
            </div>
            <button type="submit" class="btn btn-primary btn-login-submit">Login</button>
        </form>

        <!-- Quick Demo Credentials Helper & Theme Switcher -->
        <div class="quick-role-wrapper">
            <p class="quick-role-title">Quick Role Login & Theme Switcher</p>
            <div class="quick-role-grid">
                <button type="button" class="role-btn role-admin" onclick="fillCreds('admin', 'admin123', 'admin', this)">
                    <i class="fas fa-user-shield"></i> Sub Warden
                </button>
                <button type="button" class="role-btn role-security" onclick="fillCreds('SEC001', 'security123', 'security', this)">
                    <i class="fas fa-shield-alt"></i> Security
                </button>
                <button type="button" class="role-btn role-maintenance" onclick="fillCreds('MNT001', 'maintenance123', 'maintenance', this)">
                    <i class="fas fa-tools"></i> Maintenance
                </button>
                <button type="button" class="role-btn role-cleaning" onclick="fillCreds('CLN001', 'cleaning123', 'cleaning', this)">
                    <i class="fas fa-broom"></i> Cleaning
                </button>
                <button type="button" class="role-btn role-student" onclick="fillCreds('TG/2021/0001', 'password123', 'student', this)">
                    <i class="fas fa-user-graduate"></i> Student
                </button>
                <button type="button" class="role-btn role-default active" onclick="fillCreds('', '', 'yellow', this)" title="Reset to original yellow background">
                    <i class="fas fa-undo"></i> Default
                </button>
            </div>
        </div>
    </div>

    <script>
        function applyTheme(theme) {
            document.body.classList.remove('theme-admin', 'theme-security', 'theme-maintenance', 'theme-cleaning', 'theme-student', 'theme-yellow');
            if (theme && theme !== 'yellow' && theme !== 'default') {
                document.body.classList.add('theme-' + theme);
            } else {
                document.body.classList.add('theme-yellow');
            }
        }

        // Fill credentials and dynamically switch the login page background theme
        function fillCreds(u, p, theme, btn) {
            if (u !== '') document.getElementById('username').value = u;
            if (p !== '') document.getElementById('password').value = p;
            document.getElementById('errorMsg').style.display = 'none';

            applyTheme(theme);

            // Sync active state on role buttons
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            if (btn) {
                btn.classList.add('active');
            }
        }

        // Detect role while user is typing in username input and change theme dynamically
        function detectThemeFromInput(val) {
            const v = (val || '').trim().toUpperCase();
            let theme = 'yellow';
            let btnClass = '.role-default';

            if (v.startsWith('SEC') || v.includes('SECURITY')) {
                theme = 'security';
                btnClass = '.role-security';
            } else if (v.startsWith('MNT') || v.includes('MAINT')) {
                theme = 'maintenance';
                btnClass = '.role-maintenance';
            } else if (v.startsWith('CLN') || v.includes('CLEAN')) {
                theme = 'cleaning';
                btnClass = '.role-cleaning';
            } else if (v.startsWith('TG') || v.includes('STUDENT')) {
                theme = 'student';
                btnClass = '.role-student';
            } else if (v.startsWith('ADMIN') || v.includes('WARDEN')) {
                theme = 'admin';
                btnClass = '.role-admin';
            }

            applyTheme(theme);
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            const matchedBtn = document.querySelector(btnClass);
            if (matchedBtn) matchedBtn.classList.add('active');
        }

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/hms/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ studentId: username, password: password })
                });

                if (res.ok) {
                    const user = await res.json();
                    // Save session data in local storage for all portals
                    localStorage.setItem('userId', user.id);
                    localStorage.setItem('userName', user.fullName);
                    localStorage.setItem('userRole', user.role);
                    localStorage.setItem('hms_user', JSON.stringify({
                        id: user.id,
                        username: user.studentId,
                        fullName: user.fullName,
                        role: user.role
                    }));

                    // Role-based redirect
                    const role = (user.role || '').toUpperCase();
                    if (role === 'ADMIN') {
                        window.location.href = 'admin/dashboard.html';
                    } else if (role === 'SECURITY') {
                        window.location.href = 'security/dashboard.html';
                    } else if (role === 'MAINTENANCE') {
                        window.location.href = 'maintenance/dashboard.html';
                    } else if (role === 'CLEANING') {
                        window.location.href = 'cleaning/dashboard.html';
                    } else {
                        window.location.href = 'student/dashboard.html';
                    }
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            } catch (e) {
                console.error("Login failed", e);
                document.getElementById('errorMsg').textContent = 'Network or server error during login.';
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
