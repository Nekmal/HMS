<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RUHUNA Hostel Management System</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
    <div class="login-box">
        <div class="login-brand-header">
            <div class="brand-icon-circle">
                <i class="fas fa-hotel"></i>
            </div>
            <h2 class="brand-title">RUHUNA</h2>
            <p class="brand-subtitle">Hostel Management System</p>
            <div class="brand-divider"></div>
        </div>
        <div id="errorMsg" class="error-msg">Invalid Credentials!</div>
        <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Student ID / Username <span class="required-star">*</span></label>
                <input type="text" id="username" required placeholder="e.g. sub warden (admin), security, maintenance, cleaning">
            </div>
            <div class="form-group">
                <label>Password <span class="required-star">*</span></label>
                <input type="password" id="password" required placeholder="Password">
            </div>
            <button type="submit" class="btn btn-primary btn-login-submit">Login</button>
        </form>

        <!-- Quick Demo Credentials Helper -->
        <div style="margin-top: 25px; padding-top: 15px; border-top: 1px dashed rgba(255,255,255,0.2); text-align: center;">
            <p style="font-size: 0.8rem; color: #a0aec0; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Quick Role Login (Click to fill)</p>
            <div style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;">
                <button type="button" onclick="fillCreds('admin', 'admin123')" style="background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.4); color: #818cf8; padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; transition: 0.2s;"><i class="fas fa-user-shield me-1"></i>Sub Warden</button>
                <button type="button" onclick="fillCreds('security', 'security123')" style="background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; transition: 0.2s;"><i class="fas fa-shield-alt me-1"></i>Security</button>
                <button type="button" onclick="fillCreds('maintenance', 'maintenance123')" style="background: rgba(245, 158, 11, 0.2); border: 1px solid rgba(245, 158, 11, 0.4); color: #fbbf24; padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; transition: 0.2s;"><i class="fas fa-tools me-1"></i>Maintenance</button>
                <button type="button" onclick="fillCreds('cleaning', 'cleaning123')" style="background: rgba(6, 182, 212, 0.2); border: 1px solid rgba(6, 182, 212, 0.4); color: #22d3ee; padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; transition: 0.2s;"><i class="fas fa-broom me-1"></i>Cleaning</button>
                <button type="button" onclick="fillCreds('TG/2021/0001', 'password123')" style="background: rgba(168, 85, 247, 0.2); border: 1px solid rgba(168, 85, 247, 0.4); color: #c084fc; padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; transition: 0.2s;"><i class="fas fa-user-graduate me-1"></i>Student</button>
            </div>
        </div>
    </div>

    <script>
        function fillCreds(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
            document.getElementById('errorMsg').style.display = 'none';
        }

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/hms/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ studentId: username, password: password })
                });

                if (res.ok) {
                    const user = await res.json();
                    // Save session data in local storage for all portals
                    localStorage.setItem('userId', user.id);
                    localStorage.setItem('userName', user.fullName);
                    localStorage.setItem('userRole', user.role);
                    localStorage.setItem('hms_user', JSON.stringify({
                        id: user.id,
                        username: user.studentId,
                        fullName: user.fullName,
                        role: user.role
                    }));

                    // Role-based redirect
                    const role = (user.role || '').toUpperCase();
                    if (role === 'ADMIN') {
                        window.location.href = 'admin/dashboard.html';
                    } else if (role === 'SECURITY') {
                        window.location.href = 'security/dashboard.html';
                    } else if (role === 'MAINTENANCE') {
                        window.location.href = 'maintenance/dashboard.html';
                    } else if (role === 'CLEANING') {
                        window.location.href = 'cleaning/dashboard.html';
                    } else {
                        window.location.href = 'student/dashboard.html';
                    }
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            } catch (e) {
                console.error("Login failed", e);
                document.getElementById('errorMsg').textContent = 'Network or server error during login.';
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
